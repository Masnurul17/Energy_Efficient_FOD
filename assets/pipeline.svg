<svg viewBox="0 0 1260 310" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1260" height="310" fill="url(#bg)"/>
  <text x="630" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Proposed Pipeline — Frame Difference + AI Classifier (FMOD)</text>

  <!-- P1 Input -->
  <rect x="20" y="70" width="170" height="200" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <rect x="20" y="70" width="170" height="36" rx="12" fill="#6366f1"/>
  <text x="105" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Input Video</text>
  <text x="105" y="140" text-anchor="middle" font-size="13" fill="#1e293b">3-channel</text>
  <text x="105" y="160" text-anchor="middle" font-size="13" fill="#1e293b">video frames</text>
  <rect x="55" y="185" width="80" height="55" rx="6" fill="#c7d2fe"/>
  <circle cx="95" cy="205" r="9" fill="#6366f1"/>
  <text x="95" y="232" text-anchor="middle" font-size="11" fill="#3730a3">camera</text>

  <!-- P2 Movement Detection -->
  <rect x="230" y="70" width="245" height="200" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="230" y="70" width="245" height="36" rx="12" fill="#3b82f6"/>
  <text x="352" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1 · Movement Detection</text>
  <text x="248" y="132" font-size="12.5" fill="#1e293b">• Frame difference (|Im1−Im2|)</text>
  <text x="248" y="156" font-size="12.5" fill="#1e293b">• Grayscale + Gaussian blur</text>
  <text x="248" y="180" font-size="12.5" fill="#1e293b">• Erosion → Dilation (opening)</text>
  <text x="248" y="204" font-size="12.5" fill="#1e293b">• Threshold (Otsu)</text>
  <text x="248" y="228" font-size="12.5" fill="#1e293b">• ROI bounding box</text>
  <rect x="248" y="240" width="210" height="18" rx="4" fill="#dbeafe"/>
  <text x="353" y="253" text-anchor="middle" font-size="11" fill="#1d4ed8">image morphology</text>

  <!-- P3 Pre-processing -->
  <rect x="515" y="70" width="210" height="200" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <rect x="515" y="70" width="210" height="36" rx="12" fill="#10b981"/>
  <text x="620" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2 · Pre-processing</text>
  <text x="533" y="140" font-size="12.5" fill="#1e293b">• Crop ROI</text>
  <text x="533" y="166" font-size="12.5" fill="#1e293b">• Resize 224×224×3</text>
  <text x="533" y="192" font-size="12.5" fill="#1e293b">• Mean subtraction</text>
  <text x="533" y="216" font-size="12.5" fill="#1e293b">  (ImageNet norm)</text>
  <rect x="533" y="232" width="174" height="22" rx="4" fill="#d1fae5"/>
  <text x="620" y="247" text-anchor="middle" font-size="11" fill="#047857">bilinear interpolation</text>

  <!-- P4 Classifier -->
  <rect x="765" y="70" width="250" height="200" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="765" y="70" width="250" height="36" rx="12" fill="#8b5cf6"/>
  <text x="890" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3 · AI Classifier</text>
  <rect x="783" y="120" width="100" height="26" rx="6" fill="#ede9fe"/><text x="833" y="138" text-anchor="middle" font-size="12" fill="#5b21b6">MobileNet</text>
  <rect x="897" y="120" width="100" height="26" rx="6" fill="#ede9fe"/><text x="947" y="138" text-anchor="middle" font-size="12" fill="#5b21b6">ResNet50</text>
  <rect x="783" y="152" width="100" height="26" rx="6" fill="#ede9fe"/><text x="833" y="170" text-anchor="middle" font-size="12" fill="#5b21b6">Inception-v4</text>
  <rect x="897" y="152" width="100" height="26" rx="6" fill="#ede9fe"/><text x="947" y="170" text-anchor="middle" font-size="12" fill="#5b21b6">ViT Base</text>
  <rect x="783" y="192" width="214" height="26" rx="6" fill="#8b5cf6"/>
  <text x="890" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Softmax → class</text>
  <text x="890" y="244" text-anchor="middle" font-size="11.5" fill="#6d28d9">pretrained on ImageNet</text>

  <!-- P5 Output -->
  <rect x="1055" y="70" width="185" height="200" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="1055" y="70" width="185" height="36" rx="12" fill="#f59e0b"/>
  <text x="1147" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Output</text>
  <rect x="1080" y="125" width="135" height="80" rx="6" fill="#ffedd5" stroke="#fdba74"/>
  <rect x="1100" y="150" width="70" height="45" rx="3" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="1135" y="143" text-anchor="middle" font-size="10.5" fill="#9a3412">bird 92.6%</text>
  <text x="1147" y="232" text-anchor="middle" font-size="12" fill="#1e293b">Bounding box</text>
  <text x="1147" y="250" text-anchor="middle" font-size="12" fill="#1e293b">+ label · FPS</text>

  <!-- arrows -->
  <line x1="192" y1="170" x2="226" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="477" y1="170" x2="511" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="727" y1="170" x2="761" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1017" y1="170" x2="1051" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
</svg>
