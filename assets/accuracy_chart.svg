<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Bird-class Accuracy (%) — MobileNet vs YOLOX</text>

  <!-- gridlines + y labels (0..100), plot y: 320(0) .. 40(100), 2.8 px/unit -->
  <line x1="80" y1="320" x2="730" y2="320" stroke="#cbd5e1"/>
  <line x1="80" y1="250" x2="730" y2="250" stroke="#e2e8f0"/>
  <line x1="80" y1="180" x2="730" y2="180" stroke="#e2e8f0"/>
  <line x1="80" y1="110" x2="730" y2="110" stroke="#e2e8f0"/>
  <line x1="80" y1="40"  x2="730" y2="40"  stroke="#e2e8f0"/>
  <text x="70" y="324" text-anchor="end" font-size="11" fill="#64748b">0</text>
  <text x="70" y="254" text-anchor="end" font-size="11" fill="#64748b">25</text>
  <text x="70" y="184" text-anchor="end" font-size="11" fill="#64748b">50</text>
  <text x="70" y="114" text-anchor="end" font-size="11" fill="#64748b">75</text>
  <text x="70" y="44"  text-anchor="end" font-size="11" fill="#64748b">100</text>

  <!-- Group Hailo-8 (cx=200) -->
  <rect x="150" y="61"  width="50" height="259" rx="4" fill="#22c55e"/>
  <text x="175" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">92.6</text>
  <rect x="205" y="131" width="50" height="189" rx="4" fill="#f87171"/>
  <text x="230" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">67.4</text>
  <text x="202" y="340" text-anchor="middle" font-size="13" fill="#0f172a">Hailo-8</text>

  <!-- Group Jetson (cx=390) -->
  <rect x="340" y="40"  width="50" height="280" rx="4" fill="#22c55e"/>
  <text x="365" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">100</text>
  <rect x="395" y="133" width="50" height="187" rx="4" fill="#f87171"/>
  <text x="420" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">66.9</text>
  <text x="392" y="340" text-anchor="middle" font-size="13" fill="#0f172a">Jetson Orin Nano</text>

  <!-- Group Alveo (cx=580) -->
  <rect x="530" y="56"  width="50" height="264" rx="4" fill="#22c55e"/>
  <text x="555" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">94.4</text>
  <rect x="585" y="127" width="50" height="193" rx="4" fill="#f87171"/>
  <text x="610" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">69.1</text>
  <text x="582" y="340" text-anchor="middle" font-size="13" fill="#0f172a">AMD Alveo U50</text>

  <!-- legend -->
  <rect x="250" y="365" width="16" height="16" rx="3" fill="#22c55e"/>
  <text x="272" y="378" font-size="13" fill="#0f172a">MobileNet (proposed)</text>
  <rect x="470" y="365" width="16" height="16" rx="3" fill="#f87171"/>
  <text x="492" y="378" font-size="13" fill="#0f172a">YOLOX (end-to-end)</text>
</svg>
